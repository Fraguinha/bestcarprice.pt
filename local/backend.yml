apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: stand
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: fraguinha/stand-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: stand-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: stand
spec:
  selector:
    app: backend
  ports:
    - port: 8080
      targetPort: 8080
