components:
  frontend:
    image: k3d-stand-registry:10000/fraguinha/stand-frontend:latest
    port: 8080
    replicaCount: 1
  backend:
    image: k3d-stand-registry:10000/fraguinha/stand-backend:latest
    port: 8080
    replicaCount: 1
    probePath: /healthz
    env:
      - name: PORT
        value: "8080"
      - name: NODE_ENV
        value: development
      - name: DATABASE
        valueFrom:
          secretKeyRef:
            name: stand-secrets
            key: DATABASE
      - name: SECRET
        valueFrom:
          secretKeyRef:
            name: stand-secrets
            key: SECRET
      - name: S3_ENDPOINT
        valueFrom:
          secretKeyRef:
            name: stand-secrets
            key: S3_ENDPOINT
      - name: S3_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: stand-secrets
            key: S3_ACCESS_KEY
      - name: S3_SECRET_KEY
        valueFrom:
          secretKeyRef:
            name: stand-secrets
            key: S3_SECRET_KEY
      - name: S3_BUCKET
        valueFrom:
          secretKeyRef:
            name: stand-secrets
            key: S3_BUCKET
      - name: S3_REGION
        valueFrom:
          secretKeyRef:
            name: stand-secrets
            key: S3_REGION
ingress:
  className: traefik
  clusterIssuer: ""
  hosts:
    - localhost
  tls: null
  paths:
    - path: /api
      pathType: Prefix
      component: backend
    - path: /
      pathType: Prefix
      component: frontend
